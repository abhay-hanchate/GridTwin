# docker compose up --build          -> http://localhost:8000 (offline demo: precomputed results only)
# GRIDTWIN_OFFLINE=0 docker compose up   -> computes cache misses on demand
services:
  gridtwin:
    build: .
    image: gridtwin:v2
    ports:
      - "8000:8000"
    environment:
      GRIDTWIN_OFFLINE: "${GRIDTWIN_OFFLINE:-1}"
      GRIDTWIN_CORS_ORIGINS: "http://localhost:8000"
    tmpfs:
      - /tmp
    volumes:
      # The drift monitor's state survives a restart. The results stay in the image on purpose: a volume over
      # data/results would keep serving an old demo after `docker compose up --build`.
      - monitor:/app/data/monitor
    restart: unless-stopped

volumes:
  monitor:
